name: 'Sync Git repos'
description: 'Sync Git repositories from a source platform to a destination platform'
author: 'Yuanhao Ji'

inputs:
  src_platform:
    description: 'Source platform (e.g. gitcode.com)'
    required: false
    default: 'gitcode.com'
  src_repo:
    description: 'Source repository in format "owner/repo"'
    required: true
  src_token:
    description: 'Source platform access token'
    required: true
  dst_platform:
    description: 'Destination platform (e.g. github.com)'
    required: false
    default: 'github.com'
  dst_repo:
    description: 'Destination repository in format "owner/repo"'
    required: true
  dst_token:
    description: 'Destination platform access token'
    required: true
  branches:
    description: 'Branches to sync, comma-separated, or "*" for all branches (default: "*")'
    required: false
    default: '*'
  force:
    description: 'Overwrite existing files on the destination (default: false)'
    required: false
    default: 'false'
  dry_run:
    description: 'Dry run mode - only show what would be done (default: false)'
    required: false
    default: 'false'

outputs:
  sync_status:
    description: 'Sync status summary ("success" or "failed")'
  synced_branches:
    description: 'List of successfully synced branches'
  failed_branches:
    description: 'List of branches that failed to sync'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'git-merge'
  color: 'blue'
